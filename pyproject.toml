[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"
[project]
name = "knowledge-network-ops"
version = "0.1.0"
requires-python = ">=3.11"
description = "Rights-safe video operations control plane"
dependencies = ["tzdata==2026.2; sys_platform == 'win32'"]
[tool.setuptools.packages.find]
where = ["src"]
