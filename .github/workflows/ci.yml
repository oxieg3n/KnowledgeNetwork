name: Software validation
on:
  push:
    branches: [main, feat/video-operations, feature/collector-v7-overnight]
    paths-ignore: ['state/**', 'reports/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Legacy full regression — retention preflight (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Hold destructive legacy teardown until retention is migrated
        run: python tools/check_archive_retention.py --scope legacy-tests
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-render.txt .
      - name: Unit and recovery tests (no secrets, no publishing)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Reject tracked media and credential files
        if: always()
        run: |
          python - <<'PY'
          import pathlib, subprocess
          files=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          bad=[x for x in files if pathlib.Path(x).suffix.lower() in {'.mp4','.mp3','.wav','.onnx'} or 'client_secret' in x or 'token.json' in x]
          assert not bad, 'Forbidden tracked files'
          PY
  retention-focused:
    name: Retention-safe focused checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read-only retention preflight for selected suites
        run: python tools/check_archive_retention.py --scope focused
      - name: Install pinned focused dependencies without building the project
        run: python -m pip install --disable-pip-version-check -r requirements-render.txt 'tzdata==2026.2'
      - name: Focused suites only — not full legacy acceptance
        run: >-
          python -m unittest -v
          tests.test_collector_fixture_retention
          tests.test_collector_narrator_recovery_integration
          tests.test_collector_voxcpm2_retention
          tests.test_collector_editor_short
          tests.test_collector_archive_policy
          tests.test_collector_controller_data_plan
          tests.test_collector_narrator_recovery_probe.ProbeContractTests
          tests.test_collector_narrator_recovery_ancestors.RecoveryInspectorBytesTests
      - name: Reject tracked media, credentials and local archives
        if: always()
        run: |
          python - <<'PY'
          import pathlib, subprocess
          files=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          bad=[x for x in files if pathlib.Path(x).suffix.lower() in {'.mp4','.mp3','.wav','.onnx'} or 'client_secret' in x or 'token.json' in x or pathlib.PurePosixPath(x).parts[0]=='old']
          assert not bad, 'Forbidden tracked files'
          PY
  windows-build:
    name: Windows worker scope — prior evidence only when unchanged
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reuse accepted 190 checks only for identical worker sources
        run: python tools/check_archive_retention.py --scope worker
