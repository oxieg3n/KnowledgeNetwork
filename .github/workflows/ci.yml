name: Software validation
on:
  push:
    branches: [main, feat/video-operations]
    paths-ignore: ['state/**', 'reports/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned graphics test dependency
        run: python -m pip install --disable-pip-version-check Pillow==13.0.0
      - name: Unit and recovery tests (no secrets, no publishing)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Reject tracked media and credential files
        run: |
          python - <<'PY'
          import pathlib, subprocess
          files=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          bad=[x for x in files if pathlib.Path(x).suffix.lower() in {'.mp4','.mp3','.wav','.onnx'} or 'client_secret' in x or 'token.json' in x]
          assert not bad, 'Forbidden tracked files'
          PY
