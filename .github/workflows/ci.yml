name: Software validation
on:
  push:
    branches: [main, feat/video-operations, feature/collector-v7-overnight]
    paths-ignore: ['state/**', 'reports/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-render.txt .
      - name: Unit and recovery tests (no secrets, no publishing)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Reject tracked media and credential files
        run: |
          python - <<'PY'
          import pathlib, subprocess
          files=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          bad=[x for x in files if pathlib.Path(x).suffix.lower() in {'.mp4','.mp3','.wav','.onnx'} or 'client_secret' in x or 'token.json' in x]
          assert not bad, 'Forbidden tracked files'
          PY
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - name: Restore locked worker dependencies
        run: dotnet restore collector/windows/Collector/Collector.csproj --locked-mode -r win-x64
      - name: Build worker
        run: dotnet build collector/windows/Collector/Collector.csproj -c Release -r win-x64 --no-restore
      - name: Worker protocol, persistence and denied-operation self-tests
        run: dotnet run --project collector/windows/Collector/Collector.csproj -c Release -r win-x64 --no-build -- self-test
      - name: Compile native WPF dashboard
        run: dotnet build collector/windows/Dashboard/Dashboard.csproj -c Release
